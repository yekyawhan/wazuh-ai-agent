
version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333" # gRPC
      - "6334:6334" # HTTP
    volumes:
      - qdrant_data:/qdrant/data
    restart: unless-stopped

  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wazuh-ai-agent
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      WAZUH_API_URL: ${WAZUH_API_URL} # e.g., https://your-wazuh-api:55000
      WAZUH_API_USER: ${WAZUH_API_USER}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
      LOG_LEVEL: INFO
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
