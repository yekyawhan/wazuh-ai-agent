
version: '3.8'

services:
  ai-agent:
    build:
      context: ../ai-agent # Assuming ai-agent code is in a sibling directory
      dockerfile: Dockerfile
    image: wazuh-ai-agent:production
    container_name: wazuh-ai-agent
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - WAZUH_MANAGER_IP=${WAZUH_MANAGER_IP}
      - WAZUH_API_PORT=${WAZUH_API_PORT}
      - WAZUH_API_USER=${WAZUH_API_USER}
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Add other AI Agent specific environment variables here
    ports:
      - "8000:8000" # FastAPI default port
    volumes:
      - ./ai-agent-data:/app/data # For any persistent data like models or logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    ports:
      - "6333:6333" # gRPC
      - "6334:6334" # HTTP
    volumes:
      - ./qdrant_data:/qdrant/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6334/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  feedback-loop:
    build:
      context: ../wazuh-phase5 # Assuming feedback_loop.py is in wazuh-phase5
      dockerfile: Dockerfile.feedback # Custom Dockerfile for feedback loop
    image: wazuh-feedback-loop:production
    container_name: wazuh-feedback-loop
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - FEEDBACK_PORT=8001
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - qdrant

  rollback-manager:
    build:
      context: ../rollback-manager # Assuming rollback-manager code is in a sibling directory
      dockerfile: Dockerfile
    image: wazuh-rollback-manager:production
    container_name: wazuh-rollback-manager
    environment:
      - WAZUH_MANAGER_IP=${WAZUH_MANAGER_IP}
      - WAZUH_API_PORT=${WAZUH_API_PORT}
      - WAZUH_API_USER=${WAZUH_API_USER}
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD}
      # Add other rollback manager specific environment variables here
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "8002:8002"

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus_config:/etc/prometheus/
      - ./prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  ai-agent-data:
  qdrant_data:
  prometheus_data:
  grafana_data:

